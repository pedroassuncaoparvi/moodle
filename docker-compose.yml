services:
  db:
    image: mariadb:10.11
    container_name: moodle-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle
    ports:
      - "3306:3306"

  web:
    build: .
    container_name: moodle-web
    restart: always
    env_file:
      - .env
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - moodledata:/moodledata
    depends_on:
      - db

volumes:
  moodledata: